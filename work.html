<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Work — Branding, Apps & Print Projects | Avora Brands</title>
<meta name="description" content="12 case studies: VTIARA Clinic, Sri Veluguvani, CashAlert, Bhakti TV, Picxel AI, Local Service Finder, Swagat Stay and more.">
<meta property="og:image" content="images/img-bhaktitv.jpg">
<meta name="theme-color" content="#060A18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="work" class="dark-top">
<div data-header></div>
<main>
  <section class="page-hero work-hero3" id="spot">
    <div class="sp-bg" id="spBg" aria-hidden="true"></div>
    <div class="container on-dark sp-wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Work</span></nav>
      <div class="sp-main">
        <div class="sp-copy">
          <span class="eyebrow">Our work · <span id="spCount"></span></span>
          <div class="sp-text" id="spText" aria-live="polite"></div>
        </div>
        <a class="sp-frame" id="spFrame" href="#"><img id="spImg" alt=""></a>
      </div>
      <div class="sp-rail" id="spRail" role="tablist" aria-label="Featured projects"></div>
    </div>
  </section>

  <section class="section" style="padding-top:72px">
    <div class="container">
      <div class="filters" role="tablist" aria-label="Filter projects" id="filters"></div>
      <div class="work-grid" id="grid"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container"><div class="cta-band on-dark" style="grid-template-columns:1fr auto">
      <div><span class="eyebrow">Your project next?</span><h2 class="h2 mt-16">Let's make something <span class="serif gold-text">worth showing off.</span></h2></div>
      <div class="btn-row"><a class="btn btn--gold" href="contact.html" data-magnetic>Start a project <i data-i="arrow"></i></a></div>
    </div></div>
  </section>
</main>
<div data-footer></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
  /* hero: auto-rotating featured project showcase */
  (() => {
    const ids = ['vydehi', 'cashalert-app', 'bhaktitv', 'localservice-web', 'picxel-app', 'veluguvani'];
    const F = ids.map(id => PROJECTS.find(p => p.id === id)).filter(Boolean);
    const clients = new Set(PROJECTS.map(p => p.client)).size;
    document.getElementById('spCount').textContent = `${PROJECTS.length} projects · ${clients} clients`;
    const rail = document.getElementById('spRail'), bg = document.getElementById('spBg'), img = document.getElementById('spImg'), frame = document.getElementById('spFrame'), text = document.getElementById('spText');
    rail.innerHTML = F.map((p, i) => `<button role="tab" data-i="${i}" aria-label="${p.client}"><img src="${p.cover}" alt=""><span><b>${p.client}</b><small>${CATS[p.cat]}</small></span><i></i></button>`).join('');
    let cur = -1, timer;
    const DUR = 6000;
    const go = i => {
      if (i === cur) return; cur = i; const p = F[i];
      rail.querySelectorAll('button').forEach((b, k) => { b.classList.toggle('on', k === i); b.setAttribute('aria-selected', k === i); });
      bg.style.backgroundImage = `url('${p.cover}')`;
      img.classList.remove('in'); text.classList.remove('in');
      setTimeout(() => {
        img.src = p.cover; img.alt = `${p.client}: ${p.title}`; frame.href = `case.html?p=${p.id}`;
        text.innerHTML = `<span class="sp-cat">${CATS[p.cat]} · ${p.year}</span><h1>${p.title}</h1><p>${p.client}. ${p.summary}</p>
          <div class="btn-row"><a class="btn btn--gold" href="case.html?p=${p.id}">View project <i data-i="arrow"></i></a><a class="btn btn--ghost" href="#grid">All ${PROJECTS.length} projects</a></div>`;
        if (window.renderIcons) renderIcons(text);
        img.classList.add('in'); text.classList.add('in');
      }, 260);
      clearTimeout(timer); timer = setTimeout(() => go((cur + 1) % F.length), DUR);
    };
    rail.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });
    const spot = document.getElementById('spot');
    spot.addEventListener('mouseenter', () => { clearTimeout(timer); spot.classList.add('paused'); });
    spot.addEventListener('mouseleave', () => { spot.classList.remove('paused'); clearTimeout(timer); timer = setTimeout(() => go((cur + 1) % F.length), DUR); });
    go(0);
  })();
  const grid = document.getElementById('grid'), fl = document.getElementById('filters');
  const start = new URLSearchParams(location.search).get('filter') || 'all';
  fl.innerHTML = [['all', 'All work'], ...Object.entries(CATS)].map(([k, v]) => `<button role="tab" data-f="${k}" class="${k === start ? 'active' : ''}">${v} <span class="muted" style="font-weight:600">${k === 'all' ? PROJECTS.length : PROJECTS.filter(p => p.cat === k).length}</span></button>`).join('');
  grid.innerHTML = PROJECTS.map(workCard).join('');
  const apply = f => {
    fl.querySelectorAll('button').forEach(b => { b.classList.toggle('active', b.dataset.f === f); b.setAttribute('aria-selected', b.dataset.f === f); });
    grid.querySelectorAll('.work-card').forEach(c => { const show = f === 'all' || c.dataset.cat === f; c.classList.toggle('hide', !show); if (show) c.classList.add('in'); });
  };
  fl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { apply(b.dataset.f); history.replaceState(null, '', b.dataset.f === 'all' ? 'work.html' : `?filter=${b.dataset.f}`); } });
  apply(start); watchReveals(grid);
</script>
</body>
</html>
