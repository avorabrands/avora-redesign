<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Study — Avora Brands</title>
<meta name="description" content="Avora Brands case study.">
<meta name="theme-color" content="#060A18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="work" class="dark-top">
<div data-header></div>
<main id="cs"></main>
<div data-footer></div>
<script src="assets/js/data.js"></script>
<script>
  /* render before site.js so shared behaviours bind to the case study */
  (() => {
    const id = new URLSearchParams(location.search).get('p');
    const i = Math.max(0, PROJECTS.findIndex(p => p.id === id)), p = PROJECTS[i], next = PROJECTS[(i + 1) % PROJECTS.length];
    document.title = `${p.client} — ${CATS[p.cat]} Case Study | Avora Brands`;
    document.querySelector('meta[name=description]').content = p.summary;
    const g = p.gallery;
    document.getElementById('cs').innerHTML = `
    <section class="page-hero" style="padding-bottom:130px">
      <div class="stars"></div><div class="rangoli-bg"></div>
      <div class="container on-dark">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="work.html">Work</a><span>/</span><span>${p.client}</span></nav>
        <span class="chip chip--gold reveal">${CATS[p.cat]}</span>
        <p class="mt-24 reveal" style="font-weight:700;color:#A9B1C7;font-size:18px">${p.client}</p>
        <h1 class="h1 mt-8" data-split>${p.title}</h1>
        <p class="lead reveal" style="--d:.3s">${p.summary}</p>
      </div>
    </section>
    <div class="container"><div class="cs-hero-img reveal-scale"><img src="${p.cover}" alt="${p.client} — ${p.title}"></div></div>
    <section class="section--tight"><div class="container">
      <div class="cs-meta reveal"><div><small>Industry</small><b>${p.industry}</b></div><div><small>Services</small><b>${p.services}</b></div><div><small>Timeline</small><b>${p.timeline}</b></div><div><small>Year</small><b>${p.year}</b></div></div>
    </div></section>
    <section class="section" style="padding-top:20px"><div class="container cs-body">
      <nav class="cs-toc" aria-label="On this page"><a href="#overview" class="active">Overview</a><a href="#challenge">Challenge</a><a href="#solution">Solution</a><a href="#results">Highlights</a><a href="#deliverables">Deliverables</a><a href="#gallery">Gallery</a></nav>
      <div>
        <div class="cs-sec reveal" id="overview"><span class="eyebrow">Overview</span><h2 class="mt-8">The brief</h2><p>${p.overview}</p></div>
        <div class="cs-sec reveal" id="challenge"><span class="eyebrow">Challenge</span><h2 class="mt-8">What made it hard</h2><p>${p.challenge}</p></div>
        <div class="cs-sec reveal" id="solution"><span class="eyebrow">Solution</span><h2 class="mt-8">What we did</h2><p>${p.solution}</p></div>
        <div class="cs-sec reveal" id="results"><span class="eyebrow">Highlights</span><h2 class="mt-8">The outcome</h2><div class="result-list">${p.results.map(([k, v]) => `<div><small>${k}</small>${v}</div>`).join('')}</div></div>
        <div class="cs-sec reveal" id="deliverables"><span class="eyebrow">Deliverables</span><h2 class="mt-8">What we handed over</h2><div class="deliv">${p.deliverables.map(d => `<div>${d}</div>`).join('')}</div></div>
        <div class="cs-sec" id="gallery"><span class="eyebrow">Gallery</span><h2 class="mt-8">A closer look</h2>
          <div class="gallery">${g.map((s, k) => `<img class="reveal ${g.length % 2 && k === 0 ? 'wide' : ''}" src="${s}" alt="${p.client} design detail ${k + 1}" loading="lazy">`).join('')}</div></div>
      </div>
    </div></section>
    <section class="section" style="padding-top:0"><div class="container">
      <div class="grid g-2">
        <a class="next-proj reveal" href="case.html?p=${next.id}"><div><small>Next project</small><h3 class="h3 mt-8">${next.client}</h3><p style="color:#A9B1C7">${next.title}</p></div><span class="go"><i data-i="arrow"></i></span></a>
        <a class="next-proj reveal" style="background:linear-gradient(130deg,#FFE7A3,#F5B942 50%,#FF8A1F);color:var(--navy-950)" href="${wa('Hi Avora! I saw the ' + p.client + ' case study and want something similar.')}" target="_blank" rel="noopener"><div><small style="color:#6B3A00">Like this?</small><h3 class="h3 mt-8">Start a similar project</h3><p style="color:#5A3A10">Free 15-minute call</p></div><span class="go" style="background:var(--navy-950);color:#fff"><i data-i="arrow"></i></span></a>
      </div>
    </div></section>`;
  })();
</script>
<script src="assets/js/site.js"></script>
<script>
  const toc = [...document.querySelectorAll('.cs-toc a')];
  const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) toc.forEach(a => a.classList.toggle('active', a.hash === '#' + e.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('.cs-sec').forEach(s => o.observe(s));
</script>
</body>
</html>
